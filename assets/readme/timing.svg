<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="880" height="170" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="1.2">
    <rect x="80"  y="50" width="240" height="40"/>
    <rect x="320" y="50" width="240" height="40"/>
    <rect x="560" y="50" width="240" height="40"/>
  </g>
  <g fill="#111" text-anchor="middle">
